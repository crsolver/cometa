name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Native dependencies for Ebitengine (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config xvfb
      - name: Vet
        run: go vet ./...
      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a go test ./... 2>&1 | tee test.log
      - name: Test
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.log
      # Shows the failing tests on the run's summary page, without opening the log.
      - name: Summarize failures
        if: failure()
        shell: bash
        run: |
          msg="$(grep -E -A6 -e '--- FAIL' -e '^FAIL' -e '^panic:' test.log | cut -c1-300 | head -n 120 || true)"
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\r'/}"
          msg="${msg//$'\n'/'%0A'}"
          echo "::error title=Pruebas fallidas (${{ matrix.os }})::${msg}"

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the VS Code extension and language server
        working-directory: vscode-extension
        run: |
          npm ci
          npm run build
