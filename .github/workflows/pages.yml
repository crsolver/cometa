name: Sitio web

on:
  push:
    branches: [main]
    paths:
      - "webpage/**"
      - "docs/**"
      - "specs.md"
      - "examples/**"
      - "internal/stdlib/**"
      - "cmd/gendocs/**"
      - "vscode-extension/syntaxes/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webpage/package-lock.json
      - name: Instalar dependencias
        working-directory: webpage
        run: npm ci
      - name: Construir (genera la referencia de la biblioteca estándar)
        working-directory: webpage
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webpage/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
